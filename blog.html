<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tin tức — PAUSE COFFEE</title>
  <meta name="description" content="Kiến thức và câu chuyện về cà phê từ PAUSE COFFEE.">
  <link rel="icon" href="images/lynk/favicon_new.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Condensed:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body data-page="blog">
<main id="main">
  <section class="page-banner"><div class="container">
    <div class="crumbs"><a href="index.html">Trang chủ</a> / Tin tức</div>
    <h1>Tin tức & Kiến thức</h1><p>Những câu chuyện nhỏ bên tách cà phê và bí quyết pha chế từ đội ngũ LYNK.</p>
  </div></section>
  <section class="section" style="padding-top:50px"><div class="container"><div class="card-grid" id="grid"></div></div></section>
</main>
<div id="site-footer"></div>
<script src="js/data.js"></script><script src="js/layout.js?v=2"></script><script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const D = window.LYNK_DATA, L = window.Lynk, grid = document.getElementById('grid');
  grid.innerHTML = D.blogs.map((b, i) => `<article class="blog-card reveal d${i + 1}" data-b="${b.id}" tabindex="0">
    <div class="b-thumb"><img loading="lazy" src="${b.image}" alt="${L.esc(b.title)}"></div>
    <div class="b-body"><div class="b-meta">${L.esc(b.category)} · ${b.date}</div><h3 class="b-title">${L.esc(b.title)}</h3><p class="b-excerpt">${L.esc(b.excerpt)}</p><span class="b-more">Đọc tiếp →</span></div></article>`).join('');
  L.observe(grid);
  const open = (card) => { const b = D.blogs.find((x) => x.id === +card.dataset.b); L.modal('blogModal', `<div class="modal-box"><button class="x-btn" data-close aria-label="Đóng">✕</button><img src="${b.image}" alt="${L.esc(b.title)}" style="width:100%;height:300px;object-fit:cover"><div style="padding:30px 34px 38px"><div class="b-meta">${L.esc(b.category)} · ${b.date}</div><h3 style="font-size:30px;text-transform:none;margin:6px 0 16px">${L.esc(b.title)}</h3><div style="color:#444;line-height:28px;font-size:15px;display:grid;gap:12px">${b.content}</div></div></div>`); };
  grid.addEventListener('click', (e) => { const c = e.target.closest('.blog-card'); if (c) open(c); });
  grid.addEventListener('keydown', (e) => { if (e.key === 'Enter') { const c = e.target.closest('.blog-card'); if (c) open(c); } });
});
</script>
</body>
</html>
