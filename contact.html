<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liên hệ — PAUSE COFFEE</title>
  <meta name="description" content="Liên hệ PAUSE COFFEE: địa chỉ 93 Lê Cao Lãng, Tân Phú, hotline 0345 699 999.">
  <link rel="icon" href="images/lynk/favicon_new.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Condensed:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body data-page="contact">
<main id="main">
  <section class="page-banner"><div class="container">
    <div class="crumbs"><a href="index.html">Trang chủ</a> / Liên hệ</div>
    <h1>Liên hệ PAUSE</h1><p>Chúng tôi luôn sẵn lòng lắng nghe góp ý và chào đón bạn ghé quán.</p>
  </div></section>
  <section class="section" style="padding-top:50px"><div class="container">
    <div class="two-col">
      <div class="info-list">
        <div class="info-card reveal left"><span class="ic">📍</span><div><h4>Địa chỉ</h4><p>93 Lê Cao Lãng, P. Phú Thạnh, Q. Tân Phú, TP. Hồ Chí Minh</p></div></div>
        <div class="info-card reveal left d1"><span class="ic">📞</span><div><h4>Hotline</h4><p><b>0345 699 999</b> — 07:00 – 22:30 mỗi ngày</p></div></div>
        <div class="info-card reveal left d2"><span class="ic">✉️</span><div><h4>Email</h4><p>lienhe@pausecoffee.vn</p></div></div>
      </div>
      <form class="form-card reveal right" id="contactForm">
        <h3 style="font-size:28px;margin-bottom:22px">Gửi lời nhắn</h3>
        <div class="form-grid">
          <div class="field"><label for="n">Tên của bạn *</label><input class="input" id="n" name="name" required></div>
          <div class="field"><label for="e">Email *</label><input class="input" id="e" name="email" type="email" required></div>
          <div class="field full"><label for="s">Chủ đề</label><select class="input" id="s"><option>Góp ý dịch vụ</option><option>Đặt số lượng lớn / hạt rang</option><option>Hợp tác &amp; sự kiện</option><option>Khác</option></select></div>
          <div class="field full"><label for="m">Nội dung *</label><textarea class="input" id="m" rows="4" required></textarea></div>
        </div>
        <button class="btn btn-red" type="submit" style="width:100%">Gửi lời nhắn</button>
      </form>
    </div>
    <div class="map-box reveal">
      <iframe title="Bản đồ PAUSE COFFEE" src="https://www.google.com/maps?q=93+L%C3%AA+Cao+L%C3%A3ng,+Ph%C3%BA+Th%E1%BA%A1nh,+T%C3%A2n+Ph%C3%BA,+H%E1%BB%93+Ch%C3%AD+Minh&output=embed" width="100%" height="100%" style="border:0" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
    </div>
  </div></section>
</main>
<div id="site-footer"></div>
<script src="js/data.js"></script><script src="js/layout.js?v=2"></script><script src="js/app.js"></script>
<script>
document.getElementById('contactForm').addEventListener('submit', (e) => {
  e.preventDefault(); const n = e.target.name.value;
  window.Lynk.modal('msgModal', `<div class="modal-box success-box"><div class="big">✅</div><h3 style="font-size:28px;margin:8px 0">Cảm ơn ${window.Lynk.esc(n)}!</h3><p style="color:#6b6b6b">PAUSE COFFEE đã nhận lời nhắn và sẽ phản hồi sớm nhất.</p><button class="btn btn-red" style="margin-top:20px" data-close type="button">Đóng</button></div>`);
  e.target.reset();
});
</script>
</body>
</html>
